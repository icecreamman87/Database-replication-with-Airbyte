version: '3.8'

services:
  postgres_pagila:
    image: postgres:13
    container_name: postgres_pagila
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: pagila
    ports:
      - "5432:5432"
    volumes:
      - ./source_scripts:/opt/source_scripts 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
  mysql_sakila:
    image: mysql:8.0
    container_name: mysql_sakila
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: sakila
    ports:
      - "3307:3306"
    volumes:
      - ./source_scripts:/opt/source_scripts
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 5s
      retries: 5
  airflow_standalone:
    image: apache/airflow:2.9.1
    container_name: airflow_standalone
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_CONN_POSTGRES_PAGILA_CONN=postgresql://postgres:secretpassword@postgres_pagila:5432/pagila
      - AIRFLOW_CONN_MYSQL_SAKILA_CONN=mysql://root:secretpassword@mysql_sakila:3306/sakila
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./source_scripts:/opt/source_scripts
    depends_on:
      postgres_pagila:
        condition: service_healthy
      mysql_sakila:
        condition: service_healthy
    command: >
      bash -c "rm -f /opt/airflow/airflow-webserver.pid &&
      rm -f /opt/airflow/airflow-scheduler.pid &&
      airflow db migrate &&
      airflow users create --username superadmin --firstname Super --lastname Admin --role Admin --email superadmin@example.com --password superadmin || true &&
      airflow standalone"